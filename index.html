<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentoria CFO PMGO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        yellow: {
                            400: '#FACC15',
                            500: '#EAB308',
                        },
                        blue: {
                            900: '#1E3A8A',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 50%, #111827 0%, #000000 70%);
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Glow Effect for Button */
        .btn-glow {
            box-shadow: 0px 0px 40px 10px rgba(250, 204, 21, 0.15);
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            box-shadow: 0px 0px 50px 15px rgba(250, 204, 21, 0.3);
            transform: translateY(-2px);
        }

        /* Logo Circle Styling */
        .logo-circle {
            background: radial-gradient(circle, #0f172a 0%, #020617 100%);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        /* Responsive image mask for blending on mobile */
        .img-mask {
            mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
        }

        @media (min-width: 768px) {
            .img-mask {
                mask-image: linear-gradient(to left, black 80%, transparent 100%);
                -webkit-mask-image: linear-gradient(to left, black 80%, transparent 100%);
            }
        }

        /* Marker Highlight Animation */
        .highlight-text {
            background-image: linear-gradient(to right, rgba(250, 204, 21, 0.5) 50%, transparent 50%);
            background-size: 200% 100%;
            background-repeat: no-repeat;
            background-position: 100% 0;
            animation: highlight-anim 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.8s;
            color: #ffffff;
            border-radius: 2px;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
            padding: 0 2px;
        }

        @keyframes highlight-anim {
            to {
                background-position: 0 0;
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col relative antialiased">

    <main
        class="flex-1 container mx-auto px-6 py-8 md:py-12 flex flex-col md:flex-row items-center justify-center md:justify-start relative z-10 min-h-[90vh]">

        <!-- Background Image (Top on mobile, Right on desktop) -->
        <div
            class="absolute inset-x-0 top-0 md:inset-0 flex justify-center md:justify-end items-start md:items-end z-0 pointer-events-none overflow-hidden h-[50vh] md:h-auto opacity-100">
            <img src="./foto.png" alt="Professor Ricardo Ziegler"
                class="img-mask w-full h-full md:w-auto md:h-[95%] object-contain object-bottom md:object-right-bottom drop-shadow-2xl">
        </div>

        <!-- Left Column: Text Content -->
        <div
            class="w-full md:w-1/2 flex flex-col items-center text-center space-y-6 md:space-y-8 z-20 pt-[45vh] md:pt-0 relative">

            <!-- Logo (Bottom on mobile, Top on desktop) -->
            <div
                class="order-last md:order-none mt-10 md:mt-0 w-20 h-20 md:w-32 md:h-32 rounded-full border border-gray-800 logo-circle flex items-center justify-center relative overflow-hidden shadow-xl p-1 mb-8 md:mb-0">
                <img src="./logoMa.png" alt="Logo CFO PMGO"
                    class="w-full h-full object-cover rounded-full drop-shadow-lg">
            </div>

            <!-- Title -->
            <h1
                class="font-montserrat text-[26px] min-[375px]:text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-black uppercase leading-[1.1] tracking-tight w-full px-2 mt-0">
                Quem se prepara <br> antes, sai na frente  no <span class="text-yellow-400">CFO PMGO.</span>
            </h1>

            <!-- Subtitle -->
            <p class="text-gray-300 text-sm sm:text-base md:text-lg max-w-lg leading-relaxed px-4 md:px-0 font-medium">
                Tenha acesso a condições e ofertas exclusivas diretamente com <span class="highlight-text">o professor que mais aprovou alunos para a Polícia Militar.</span>
            </p>

            <!-- Badges -->
            <div
                class="flex flex-row flex-wrap items-center justify-center gap-2 sm:gap-3 text-[10px] sm:text-sm font-semibold pt-2">
                <span
                    class="bg-[#1e1b4b]/60 border border-[#3730a3]/50 text-[#818cf8] px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg tracking-wider backdrop-blur-md shadow-lg">
                    POLÍCIA MILITAR DE GOIÁS
                </span>
                <span class="text-gray-600">•</span>
                <span
                    class="bg-[#422006]/60 border border-[#854d0e]/50 text-yellow-500 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg tracking-wider flex items-center gap-1.5 sm:gap-2 backdrop-blur-md shadow-lg">
                    <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-yellow-500 animate-pulse"></span> GRUPO VIP
                </span>
            </div>

            <!-- CTA Button -->
            <a href="#"
                class="btn-glow mt-4 bg-[#FACC15] hover:bg-[#FDE047] text-black font-bold text-base sm:text-lg px-8 py-4 rounded-xl flex items-center justify-center gap-3 w-full sm:w-auto transition-all duration-300 shadow-xl">
                <!-- WhatsApp Icon -->
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51h-.57c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
                </svg>
                QUERO PARTICIPAR
                <!-- Arrow Icon -->
                <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </a>
        </div>

    </main>

    <footer
        class="w-full text-center py-6 text-gray-500 text-xs md:text-sm border-t border-gray-900 mt-auto relative z-20 bg-black/50 backdrop-blur-md">
        © 2026 Mentoria CFO PMGO • Professor & Capitão Ricardo Ziegler
    </footer>

</body>

</html>
